:root{
  --royal:#153EFD; --azure:#1569F0; --cyan:#16D0D0; --graphite:#383C4F;
  --navy-950:#030722; --navy-900:#060D35; --navy-800:#0B1650; --navy-700:#13227A; --navy-600:#1B2F9A;
  --ink:#F2F6FF; --ink-dim:#C3CEF2; --ink-faint:#9AA8DC;
  --gold:#FFC83D; --gold-deep:#FF9F1C;
  --grad:linear-gradient(100deg,var(--royal),var(--cyan));
  --font-display:"Lilita One","Segoe UI Black","Arial Black",system-ui,sans-serif;
  --font-body:"Segoe UI","Segoe UI Variable Text",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy-950);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- STAGE (1920x1080 escalado) ---------- */
#stage{position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(ellipse 80% 70% at 50% 110%,#1A2FB0 0%,transparent 60%),
             radial-gradient(ellipse 60% 50% at 50% -10%,#0E2390 0%,transparent 70%),
             linear-gradient(180deg,var(--navy-900),var(--navy-950));}
#shaker{position:absolute;inset:0}
.bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.beam{position:absolute;bottom:-80px;width:520px;height:1500px;transform-origin:50% 100%;
  background:linear-gradient(0deg,rgba(22,208,208,.30),rgba(22,208,208,.06) 55%,transparent 85%);
  clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);opacity:.55}
.beam.b1{left:80px;animation:sweepA 9s ease-in-out infinite}
.beam.b2{right:80px;animation:sweepB 11s ease-in-out infinite;background:linear-gradient(0deg,rgba(21,62,253,.42),rgba(21,62,253,.08) 55%,transparent 85%)}
.beam.b3{left:calc(50% - 260px);animation:sweepC 13s ease-in-out infinite;opacity:.3}
@keyframes sweepA{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(18deg)}}
@keyframes sweepB{0%,100%{transform:rotate(26deg)}50%{transform:rotate(-20deg)}}
@keyframes sweepC{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.floor{position:absolute;left:-10%;right:-10%;bottom:-260px;height:520px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%,rgba(22,208,208,.18),rgba(21,62,253,.10) 45%,transparent 70%)}
.spark{position:absolute;width:26px;height:26px;opacity:0;animation:twinkle 4s ease-in-out infinite}
.spark svg{width:100%;height:100%;display:block}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(45deg)}}
.streamer{position:absolute;top:-20px;width:14px;height:180px;opacity:.5}

/* moldura de lâmpadas */
.bulbs{position:absolute;left:0;right:0;height:30px;pointer-events:none;z-index:5}
.bulbs.top{top:0}.bulbs.bottom{bottom:0}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 24px 15px,#fff 0 4px,rgba(22,208,208,.9) 5px,rgba(22,208,208,0) 11px) 0 0/48px 30px repeat-x}
.bulbs::after{background:radial-gradient(circle at 24px 15px,#fff 0 4px,rgba(21,62,253,.95) 5px,rgba(21,62,253,0) 11px) 24px 0/48px 30px repeat-x;animation:blink 1.1s steps(1) infinite}
.bulbs::before{animation:blink 1.1s steps(1) infinite reverse}
.bulbs.bottom{background:linear-gradient(0deg,rgba(0,0,0,.35),transparent)}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}

#screen{position:absolute;inset:30px 0;z-index:2}
.scr{position:absolute;inset:0;animation:scrIn .6s var(--ease-out) both}
@keyframes scrIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}

#rehearsalTag{position:absolute;left:40px;bottom:44px;z-index:20;background:#D93A40;color:#fff;
  font:900 20px/1 var(--font-display);letter-spacing:.08em;padding:10px 22px;border-radius:999px;box-shadow:0 6px 24px rgba(255,90,95,.45)}

/* ---------- tipografia & componentes ---------- */
.kicker{font:800 26px/1 var(--font-body);letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.display{font-family:var(--font-display);font-weight:900;letter-spacing:-.01em}
.glow-text{color:#fff;text-shadow:0 0 18px rgba(22,208,208,.75),0 0 42px rgba(21,62,253,.6)}
.grad-text{color:var(--cyan)}

.btn{display:inline-flex;align-items:center;gap:14px;border:0;border-radius:999px;padding:22px 44px;
  font:900 34px/1 var(--font-display);letter-spacing:.01em;color:#fff;background:var(--navy-700);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.35);transition:transform .15s var(--ease-out),filter .15s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.12)}
.btn:focus-visible{outline:5px solid var(--gold);outline-offset:4px}
.btn:active{transform:translateY(2px) scale(.98)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-primary{background:linear-gradient(100deg,#1235E0,#153EFD 60%,#1F4BFF);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 4px rgba(22,208,208,.25),0 14px 40px rgba(22,140,240,.55)}
.btn-gold{background:linear-gradient(100deg,var(--gold-deep),var(--gold));color:#2A1B00}
.btn-shout{background:#fff;color:var(--royal)}
.btn-ghost{background:transparent;box-shadow:inset 0 0 0 3px rgba(169,183,232,.4)}
.btn-mega{font-size:48px;padding:30px 64px}
.btn .key{font:800 18px/1 var(--font-body);padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.22);letter-spacing:.05em}
.btn-primary.pulse{animation:btnPulse 1.6s ease-in-out infinite}
@keyframes btnPulse{0%,100%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 4px rgba(22,208,208,.25),0 14px 40px rgba(22,140,240,.55)}50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 14px rgba(22,208,208,.12),0 14px 60px rgba(22,208,208,.8)}}

.logo-plate{display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:28px;
  padding:18px 34px;box-shadow:0 0 0 6px rgba(22,208,208,.35),0 20px 60px rgba(0,0,0,.45)}
.logo-plate img{display:block;height:100%;width:auto}
.logo-mini{position:absolute;left:44px;top:22px;height:78px;padding:10px 20px;border-radius:18px;z-index:3;box-shadow:0 0 0 3px rgba(22,208,208,.3),0 10px 30px rgba(0,0,0,.4)}

.bubble{position:relative;background:#fff;color:var(--navy-900);border-radius:36px;padding:28px 36px;
  font:900 38px/1.15 var(--font-display);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.bubble::after{content:"";position:absolute;width:44px;height:44px;background:#fff;bottom:-16px;left:70px;transform:rotate(45deg);border-radius:6px}
.bubble.tail-left::after{left:-14px;bottom:auto;top:46%}
.pop{animation:pop .55s var(--ease-spring) both}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-6deg)}to{opacity:1;transform:none}}

/* ---------- MASCOTE ---------- */
.mascot{display:block;overflow:visible}
.mascot .arm-g{transform-box:view-box;transform-origin:66px 168px;transition:transform .5s var(--ease-spring)}
.mascot .arm2-g{transform-box:view-box;transform-origin:172px 168px}
.mascot .body-g{transform-box:view-box;transform-origin:120px 330px}
.mascot .head-g{transform-box:view-box;transform-origin:120px 150px}
.mascot .eyes-wide,.mascot .eyes-happy,.mascot .eyes-x,.mascot .mouth-o,.mascot .mouth-grin,.mascot .mouth-cringe,.mascot .mouth-flat,.mascot .hand-shh,.mascot .sweat,.mascot .brow-up{display:none}
/* rostos */
.mascot[data-mood=suspense] .eyes-n,.mascot[data-mood=sweat] .eyes-n{display:none}
.mascot[data-mood=suspense] .eyes-wide,.mascot[data-mood=sweat] .eyes-wide{display:inline}
.mascot[data-mood=suspense] .brows,.mascot[data-mood=sweat] .brows{display:none}
.mascot[data-mood=suspense] .brow-up,.mascot[data-mood=sweat] .brow-up{display:inline}
.mascot[data-mood=suspense] .mouth-smile,.mascot[data-mood=sweat] .mouth-smile,.mascot[data-mood=shh] .mouth-smile{display:none}
.mascot[data-mood=suspense] .mouth-o{display:inline}
.mascot[data-mood=sweat] .mouth-flat,.mascot[data-mood=sweat] .sweat{display:inline}
.mascot[data-mood=shh] .hand-shh{display:inline}
.mascot[data-mood=shh] .eyes-n,.mascot[data-mood=cringe] .eyes-n{display:none}
.mascot[data-mood=shh] .eyes-x,.mascot[data-mood=cringe] .eyes-x{display:inline}
.mascot[data-mood=cringe] .mouth-smile{display:none}.mascot[data-mood=cringe] .mouth-cringe,.mascot[data-mood=cringe] .sweat{display:inline}
.mascot[data-mood=party] .eyes-n,.mascot[data-mood=wave] .eyes-n,.mascot[data-mood=dance] .eyes-n{display:none}
.mascot[data-mood=party] .eyes-happy,.mascot[data-mood=wave] .eyes-happy,.mascot[data-mood=dance] .eyes-happy{display:inline}
.mascot[data-mood=party] .mouth-smile,.mascot[data-mood=dance] .mouth-smile{display:none}
.mascot[data-mood=party] .mouth-grin,.mascot[data-mood=dance] .mouth-grin{display:inline}
/* braços e corpo */
.mascot[data-mood=point] .arm-g{transform:rotate(95deg)}
.mascot[data-mood=wave] .arm-g{animation:wave .7s ease-in-out infinite alternate}
.mascot[data-mood=party] .arm-g{animation:wave .45s ease-in-out infinite alternate}
.mascot[data-mood=suspense] .arm-g{transform:rotate(40deg)}
.mascot[data-mood=shh] .arm-g{opacity:0}
.mascot[data-mood=idle] .body-g,.mascot[data-mood=point] .body-g,.mascot[data-mood=wave] .body-g{animation:bob 2.4s ease-in-out infinite}
.mascot[data-mood=party] .body-g{animation:jump .45s ease-in-out infinite alternate}
.mascot[data-mood=suspense] .body-g,.mascot[data-mood=sweat] .body-g{animation:jitter .18s linear infinite}
.mascot[data-mood=cringe] .body-g{transform:rotate(-4deg) scale(.97)}
.mascot[data-mood=dance] .body-g{animation:danceBody .5s ease-in-out infinite alternate}
.mascot[data-mood=dance] .head-g{animation:danceHead .25s ease-in-out infinite alternate}
.mascot[data-mood=dance] .arm-g{animation:danceArm .5s ease-in-out infinite alternate}
.mascot[data-mood=dance] .arm2-g{animation:danceArm2 .5s ease-in-out infinite alternate}
.mascot .sweat{animation:drip 1s ease-in infinite}
@keyframes wave{from{transform:rotate(138deg)}to{transform:rotate(156deg)}}
@keyframes jump{from{transform:translateY(0)}to{transform:translateY(-22px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jitter{0%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes drip{from{transform:translateY(-4px);opacity:1}to{transform:translateY(14px);opacity:0}}
@keyframes danceBody{0%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(0) translateY(-16px)}100%{transform:rotate(8deg) translateY(0)}}
@keyframes danceHead{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes danceArm{from{transform:rotate(110deg)}to{transform:rotate(155deg)}}
@keyframes danceArm2{from{transform:rotate(0)}to{transform:rotate(-35deg)}}

/* ---------- ABERTURA ---------- */
.opening{position:absolute;inset:0;display:grid;grid-template-columns:1fr 520px;align-items:center;padding:60px 120px}
.op-main{display:flex;flex-direction:column;align-items:flex-start;gap:30px}

@keyframes titleIn{from{opacity:0;transform:translateY(60px) scale(.9)}to{opacity:1;transform:none}}
.op-sub{font:700 34px/1.3 var(--font-body);color:var(--ink-dim);margin:0;animation:scrIn .8s .4s both}

/* ---------- PAINEL DE BLOCOS ---------- */
.board{position:absolute;inset:0;padding:40px 70px 30px;display:flex;flex-direction:column}

@keyframes gift{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-5deg) scale(1.04)}30%{transform:rotate(5deg) scale(1.04)}45%{transform:rotate(0) scale(1)}}

@keyframes no{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.board-foot{display:flex;align-items:center;justify-content:center;gap:30px;min-height:120px}

/* ---------- ROLETA ---------- */
.spin{position:absolute;inset:0;display:grid;grid-template-columns:900px 1fr;padding:10px 60px 0 50px;gap:30px}

  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

#wheel{position:absolute;left:20px;top:20px;width:820px;height:820px;border-radius:50%;will-change:transform}
.wheel-hub{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#DDE6FF 60%,#9FB1F0);

  font:900 84px/1 var(--font-display);color:var(--royal)}
.pointer{position:absolute;left:50%;top:-34px;width:92px;height:116px;margin-left:-46px;z-index:3;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));transform-origin:50% 20%}
.pointer.tick{animation:ptick .12s ease-out}
@keyframes ptick{0%{transform:rotate(0)}40%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
.spin-right{display:flex;flex-direction:column;padding-top:64px;min-width:0}

.placar{position:relative;overflow:hidden;border-radius:30px;background:#020517;display:flex;flex-direction:column;padding:26px 34px 24px;
  box-shadow:inset 0 0 0 4px var(--navy-600),0 0 0 8px rgba(22,208,208,.15),0 0 50px rgba(22,208,208,.2)}
.placar::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px);pointer-events:none}
.placar-top{display:flex;align-items:center;justify-content:center;gap:14px;font:900 22px/1 var(--font-body);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.placar-top i{width:12px;height:12px;border-radius:50%;background:var(--gold)}
.placar-q{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0;min-height:0}
.placar-q .qt{text-align:center;font:900 52px/1.16 var(--font-display);color:#fff;text-shadow:0 0 18px rgba(22,208,208,.55);text-wrap:balance}
.placar-q.wait .qt{color:var(--ink-faint);font-size:38px;text-shadow:none;animation:bob 2s ease-in-out infinite}
.placar-q .w-in{display:inline-block;animation:wIn .5s var(--ease-spring) both}
@keyframes wIn{from{opacity:0;transform:translateY(30px) scale(.6)}to{opacity:1;transform:none}}
.placar-bot{text-align:center;font:800 24px/1 var(--font-body);color:var(--cyan);letter-spacing:.06em}
.emo-row{display:flex;gap:26px;font-size:150px;line-height:1.1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.emo-row .spring{display:inline-block;animation:spring 1s var(--ease-spring) both}
.rv-bub{position:absolute;right:250px;bottom:300px;font-size:34px;padding:16px 24px;white-space:nowrap}
.rv.pre .rv-bub{opacity:0}.rv.go .rv-bub{animation:pop .6s var(--ease-spring) .8s both}
.bg-clock{position:absolute;right:-160px;top:-120px;width:900px;height:900px;opacity:.10;pointer-events:none}

/* jogos */
.g-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pj{position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 40px}
.pj .mascot{height:560px;flex:none;margin-bottom:-10px}
.pj .bubble{position:absolute;left:330px;right:40px;top:60px;font-size:56px;padding:40px 46px;line-height:1.08}
.pj .bubble .bk{display:block;font:900 26px/1 var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--royal);margin-bottom:16px}
.pj .bubble::after{left:-14px;top:auto;bottom:60px}
.pj .badum{position:absolute;right:60px;bottom:50px;font:900 72px/1 var(--font-display);color:var(--gold);transform:rotate(-8deg);opacity:0;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.pj .badum.go{animation:stamp 1.6s var(--ease-spring) both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}15%{opacity:1;transform:scale(1) rotate(-8deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg)}}

.emo-big{font-size:190px;line-height:1.1;text-align:center;padding:0 40px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.emo-big.txt{font:900 92px/1.05 var(--font-display);color:#fff;text-shadow:0 0 24px rgba(22,208,208,.6)}
.emo-big.spring{animation:spring 1s var(--ease-spring) both}
@keyframes spring{0%{opacity:0;transform:scale(.1) rotate(-20deg)}55%{opacity:1;transform:scale(1.18) rotate(6deg)}75%{transform:scale(.93) rotate(-2deg)}100%{transform:none}}
.emo-hist{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:center;gap:30px;font-size:54px;opacity:.55}
.idle-q{font:900 260px/1 var(--font-display);color:rgba(255,255,255,.12)}

.tr-box{width:360px;height:360px;animation:bob 1.6s ease-in-out infinite}
.tr-box.thump{animation:thump .35s var(--ease-spring)}
@keyframes thump{0%{transform:scale(1)}30%{transform:scale(1.18,.86)}100%{transform:scale(1)}}
.tum{position:absolute;font:900 120px/1 var(--font-display);color:#fff;text-shadow:0 0 30px var(--cyan);pointer-events:none;animation:tum 1s var(--ease-out) both}
@keyframes tum{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.6) translateY(-80px)}}
.eq{position:absolute;bottom:36px;left:0;right:0;display:flex;justify-content:center;gap:12px;height:140px;align-items:flex-end}
.eq i{width:30px;border-radius:8px 8px 0 0;background:var(--grad);animation:eq .6s ease-in-out infinite alternate;transform-origin:50% 100%;height:100%}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}

.sil{position:relative;width:520px;height:520px}
.sil{overflow:hidden;border-radius:50%;box-shadow:0 0 0 6px rgba(22,208,208,.35),0 0 60px rgba(22,208,208,.25)}
.sil .sil-art{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  filter:brightness(var(--b,0)) drop-shadow(0 0 22px rgba(22,208,208,.9));transform:scale(var(--z,2.6)) translate(14%,10%);transition:transform 1.6s var(--ease-out),filter 1.4s ease}
.sil .sil-art.emoji-art{font-size:380px}
.sil-q{position:absolute;font:900 90px/1 var(--font-display);color:var(--cyan);opacity:.7;animation:bob 2s ease-in-out infinite}

.clock{width:460px;height:460px}
.clock .hand{transform-origin:100px 100px;animation:rot var(--spd,8s) linear infinite}
.clock .hand.min{animation-duration:calc(var(--spd,8s)*.33)}
@keyframes rot{to{transform:rotate(360deg)}}
.bg-clock .clock{width:100%;height:100%}
.tt-mascot{position:absolute;left:40px;bottom:-10px}
.tt-mascot .mascot{height:420px}

.as-scene{position:absolute;inset:0}
.as-box{position:absolute;left:50%;top:58%;width:300px;height:300px;margin:-150px 0 0 -10px}
.as-box.shake{animation:no .4s linear 2}
.as-mascot{position:absolute;left:30px;bottom:-10px}
.as-mascot .mascot{height:520px}
.as-bubble{position:absolute;left:420px;right:30px;top:30px;font-size:44px;line-height:1.1;padding:24px 32px}
.as-bubble::after{left:auto;right:180px}
.as-mbub{position:absolute;left:24px;top:30px;max-width:380px;font-size:34px;line-height:1.1;padding:20px 24px;z-index:3}
.as-mbub::after{left:60px}
.as-mascot{z-index:2}
.as-note{position:absolute;bottom:38%;pointer-events:none;animation:noteUp 2.2s var(--ease-out) both}
@keyframes noteUp{from{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}to{opacity:0;transform:translate(var(--dx),-320px) scale(1.2) rotate(18deg)}}
.as-black{position:absolute;inset:0;z-index:40;background:#000;display:flex;align-items:center;justify-content:center;animation:fadeIn .12s both}
.as-black span{font:400 90px/1 var(--font-display);color:#2B3566}
.as-black.out{animation:fadeOut .5s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.as-psiu{position:absolute;right:60px;bottom:60px;font:900 120px/1 var(--font-display);color:#FF5A5F;text-shadow:0 8px 0 rgba(0,0,0,.35);transform:rotate(8deg);opacity:0}
.as-psiu.go{animation:stamp 1.8s var(--ease-spring) both}

.chalk{position:absolute;inset:40px;border-radius:24px;background:radial-gradient(ellipse at 40% 30%,#2E4A3F,#1C2F28 70%);
  box-shadow:inset 0 0 0 18px #7A5236,inset 0 0 0 22px #5B3B25,inset 0 0 60px rgba(0,0,0,.6),0 20px 50px rgba(0,0,0,.45);
  padding:70px 80px;font-family:"Segoe Print","Comic Sans MS","Bradley Hand",cursive;color:#F4F1E8;display:flex;flex-direction:column;justify-content:center;gap:30px}
.chalk-title{font-size:44px;opacity:.75;text-decoration:underline;text-underline-offset:10px}
.chalk-formula{font-size:76px;line-height:1.3;min-height:200px;text-shadow:0 0 2px rgba(255,255,255,.6)}
.chalk-formula .eq-op{color:#FFE27A;padding:0 .2em}
.chalk-sub{font-size:30px;opacity:.6}
.chalk .caret{display:inline-block;width:6px;height:.9em;background:#fff;margin-left:6px;animation:blink .6s steps(1) infinite;vertical-align:-0.1em}

.pz{position:relative;width:540px;height:540px}
.pz-frame{position:absolute;inset:-14px;border-radius:24px;box-shadow:inset 0 0 0 4px rgba(22,208,208,.5);
  background:repeating-linear-gradient(90deg,transparent 0 178px,rgba(169,183,232,.2) 178px 182px),repeating-linear-gradient(0deg,transparent 0 178px,rgba(169,183,232,.2) 178px 182px),rgba(6,13,53,.5)}
.pz-piece{position:absolute;width:180px;height:180px;overflow:hidden;border-radius:10px;background:#E9F0FF;
  box-shadow:0 0 0 2px rgba(255,255,255,.8),0 10px 24px rgba(0,0,0,.45);transition:transform 1.2s var(--ease-spring)}
.pz-piece .pz-inner{position:absolute;width:540px;height:540px;display:flex;align-items:center;justify-content:center}
.pz-piece .pz-inner .emoji-art{font-size:400px}
.pz-piece.placed{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.steam{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.steam i{position:absolute;width:160px;height:160px;margin:-80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);opacity:0}
.steam.go i{animation:puff 2.2s ease-out both}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.3)}25%{opacity:.9}100%{opacity:0;transform:translate(var(--x),-320px) scale(2.2)}}

/* ---------- CHUTE ---------- */
#overlay{position:absolute;inset:0;z-index:30;pointer-events:none}
#overlay.show{pointer-events:auto}
.ov-chute{position:absolute;inset:0;background:rgba(3,7,34,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:scrIn .3s both}
.ov-chute .ct{font:900 80px/1 var(--font-display);color:#fff}
.ov-chute .count.beat{animation:beat .9s var(--ease-out)}
@keyframes beat{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.ov-chute .cs{font:800 40px/1 var(--font-body);color:var(--ink-dim)}
.ov-chute .tempo{font:900 300px/1 var(--font-display);color:#FF5A5F;animation:spring .8s var(--ease-spring) both}
.ov-chute .skip{position:absolute;bottom:40px;font:700 20px var(--font-body);color:var(--ink-faint)}

/* ---------- REVELAÇÃO ---------- */
.rv{position:absolute;inset:0;overflow:hidden}
.rv-dark{position:absolute;inset:-40px;background:radial-gradient(ellipse 40% 55% at 50% 48%,rgba(255,220,120,.22),rgba(3,7,34,.92) 70%);transition:opacity 1s}
.rv-spot{position:absolute;left:50%;top:-60px;width:900px;height:1100px;margin-left:-450px;
  background:linear-gradient(180deg,rgba(255,236,170,.45),rgba(255,236,170,.08) 80%,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:0;transition:opacity .6s}
.rv-drum{position:absolute;left:0;right:0;top:44%;text-align:center;font:900 70px/1 var(--font-display);color:var(--ink-dim);animation:jitter .12s linear infinite}
.rv-tch{position:absolute;left:0;right:0;top:24px;text-align:center;font:900 132px/1 var(--font-display);color:var(--gold);
  text-shadow:0 0 30px rgba(255,200,61,.8),0 10px 0 #B5560A;letter-spacing:.02em}
.rv-art{position:absolute;left:50%;top:190px;width:500px;height:500px;margin-left:-250px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.rv-art .emoji-art{font-size:380px}
.rv-sign{position:absolute;left:50%;top:720px;transform:translateX(-50%);padding:22px 56px;border-radius:30px;background:#140B00;
  box-shadow:0 0 0 6px var(--gold),0 0 0 12px #2A1B00,0 0 60px rgba(255,200,61,.7);white-space:nowrap;max-width:1180px}
.rv-sign span{display:block;font:900 92px/1 var(--font-display);color:#FFF4CF;text-shadow:0 0 12px #FFC83D,0 0 34px #FF9F1C;overflow:hidden;text-overflow:ellipsis}
.rv-col{position:absolute;top:200px;bottom:170px;width:420px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.rv-col.l{left:60px;align-items:flex-end}.rv-col.r{right:60px;align-items:flex-start}
.rv-col .chip{font-size:40px;background:#fff;color:var(--navy-900);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.rv-col.dense .chip{font-size:36px;padding:6px 18px}
.rv-mascot{position:absolute;right:430px;bottom:20px}
.rv-mascot .mascot{height:300px}
.rv-foot{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center}
.rv.pre .rv-tch,.rv.pre .rv-art,.rv.pre .rv-sign,.rv.pre .rv-col,.rv.pre .rv-foot{opacity:0}
.rv.go .rv-spot,.rv.done .rv-spot{opacity:1}
.rv.go .rv-tch{animation:slam .7s var(--ease-spring) both}
.rv.go .rv-art{animation:artPop 1s var(--ease-spring) .15s both}
.rv.go .rv-sign{animation:signOn 1.2s ease .45s both}
.rv.go .rv-foot{animation:scrIn .6s 2.2s both}
.rv.go .rv-col .chip{animation:pop .6s var(--ease-spring) both;animation-delay:calc(1s + var(--i)*120ms)}
@keyframes slam{0%{opacity:0;transform:scale(3)}100%{opacity:1;transform:none}}
@keyframes artPop{0%{opacity:0;transform:scale(.2) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes signOn{0%,10%,20%{opacity:0}5%,15%,30%,100%{opacity:1}}
.rv .rv-art{animation-fill-mode:both}
.rv.done .rv-art .art-float,.rv.go .rv-art .art-float{animation:bob 2.6s ease-in-out 1.2s infinite}

/* ---------- RESULTADO (giro único) ---------- */
.res{position:absolute;inset:0;padding:10px 36px 14px;display:flex;flex-direction:column}
.res-head{text-align:center;padding:0 320px}
.res-head h1{margin:0;font:400 60px/1 var(--font-display);color:#fff;text-shadow:0 6px 0 var(--navy-700)}
.res-left{margin:10px 0 0;font:700 22px/1.3 var(--font-body);color:var(--ink-dim)}
.res-grid{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;gap:18px;padding:18px 0;min-height:0}
.rcard{background:#fff;color:var(--navy-900);border-radius:26px;padding:16px 20px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.35);animation:flipIn .7s var(--ease-spring) both;animation-delay:calc(var(--i) * 260ms)}
.res.static .rcard{animation:none}
.rc-head{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:2px solid #E3E9FB}
.rc-art{width:82px;height:82px;flex:none;display:flex;align-items:center;justify-content:center}
.rc-art .emoji-art{font-size:62px}
.rc-title{min-width:0}
.rc-prize{font:400 34px/1.02 var(--font-display);color:var(--navy-900);text-wrap:balance}
.rc-n{margin-top:4px;font:700 17px/1 var(--font-body);color:var(--royal)}
.rc-names{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:2px 16px;font:400 36px/1.12 var(--font-display);color:var(--navy-800)}
.rc-names.two{grid-template-columns:1fr 1fr}
.rc-names li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-foot{display:flex;justify-content:center;align-items:center;gap:22px}
.res-grid.c5{gap:14px}
.res-grid.c5 .rcard{padding:14px 14px 16px}
.res-grid.c5 .rc-names{font-size:30px;gap:2px 10px}
.res-grid.c5 .rc-prize{font-size:28px}
.res-grid.c5 .rc-art{width:64px;height:64px}

/* ---------- RESUMO ---------- */
.sum{position:absolute;inset:0;padding:30px 70px 20px;display:flex;flex-direction:column}
.sum-head{display:flex;align-items:flex-end;justify-content:space-between;padding-left:300px;padding-right:420px;min-height:100px}
.sum-head h2{margin:8px 0 0;font:900 64px/1 var(--font-display);white-space:nowrap}
.sum-body{flex:1;display:grid;grid-template-columns:1fr 520px;gap:30px;padding:24px 0;min-height:0}
.sum-table-wrap{overflow:auto;border-radius:24px;background:rgba(11,22,80,.6);box-shadow:inset 0 0 0 2px rgba(169,183,232,.15)}
.sum table{width:100%;border-collapse:collapse;font:600 24px/1.25 var(--font-body)}
.sum th{position:sticky;top:0;background:var(--navy-700);text-align:left;padding:16px 18px;font:900 20px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.sum td{padding:12px 18px;border-top:1px solid rgba(169,183,232,.12)}
.sum td.nm{font-weight:800;color:#fff}
.st{border:0;border-radius:999px;padding:8px 14px;font:800 18px/1 var(--font-body);background:rgba(22,208,208,.18);color:var(--cyan);white-space:nowrap}
.st.later{background:var(--gold);color:#2A1B00}
.sum-absent{border-radius:24px;background:rgba(255,200,61,.08);box-shadow:inset 0 0 0 2px rgba(255,200,61,.35);padding:24px 28px;overflow:auto}
.sum-absent h3{margin:0 0 16px;font:900 34px/1.1 var(--font-display);color:var(--gold)}
.sum-absent ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.sum-absent li{font:700 24px/1.25 var(--font-body)}
.sum-absent li b{display:block;color:#fff;font-size:26px}
.sum-absent .none{color:var(--ink-dim);font:600 24px/1.4 var(--font-body)}
.sum-foot{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.sum-foot .btn{font-size:28px;padding:18px 34px}

/* ---------- ENCERRAMENTO ---------- */
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center}
.end .logo-plate{height:160px;animation:pop .9s var(--ease-spring) both}
.end h1{margin:0;font:400 150px/.95 var(--font-display);color:#fff;text-shadow:0 8px 24px rgba(0,0,0,.45);animation:titleIn 1s var(--ease-spring) .2s both;text-wrap:balance}
.end h1 .grad-text{display:block;color:var(--cyan)}
.end p{margin:0;font:700 38px/1.3 var(--font-body);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:scrIn .8s .6s both}
.end-mascot{position:absolute;right:90px;bottom:0}
.end-mascot .mascot{height:420px}
.end-mascot.l{right:auto;left:100px;transform:scaleX(-1)}
.end .back{position:absolute;left:40px;bottom:20px;font-size:20px;padding:12px 20px;opacity:.4}

/* ---------- ARTE ---------- */
.prize-svg{width:100%;height:100%;display:block;overflow:visible}
.emoji-art{line-height:1;display:block;text-align:center}
.img-art{max-width:100%;max-height:100%;object-fit:contain;display:block}
.art-float{width:100%;height:100%;display:flex;align-items:center;justify-content:center}

/* ---------- HUD (fora do palco) ---------- */
#hud{position:fixed;right:14px;top:10px;z-index:100;opacity:.55;transition:opacity .2s;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;
  background:rgba(3,7,34,.55);box-shadow:inset 0 0 0 1px rgba(169,183,232,.25)}
#hud:hover,#hud:focus-within{opacity:1}
#hud button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--ink-dim);padding:0}
#hud button:hover{background:rgba(255,255,255,.12);color:#fff}
#hud svg{width:22px;height:22px}
#hud input[type=range]{width:96px;accent-color:var(--cyan)}
#hud .gear{opacity:.45}
#hud .muted{color:#FF5A5F}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(40px);opacity:0;z-index:200;background:#fff;color:var(--navy-900);
  font:700 18px/1.3 var(--font-body);padding:14px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.3s var(--ease-out);pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* abas Teste x Meu sorteio (acima da configuração e do palco) */
#modeTabs{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:210;display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(3,7,34,.75);box-shadow:inset 0 0 0 1px rgba(169,183,232,.3)}
#modeTabs button{border:0;border-radius:999px;padding:8px 18px;font:700 14px/1 var(--font-body);color:var(--ink-dim);background:transparent}
#modeTabs button:hover{color:#fff}
#modeTabs button.on{background:var(--cyan);color:var(--navy-900)}
#modeTabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cfg{padding-top:56px}

/* ---------- CONFIGURAÇÃO (tela do operador, não escalada) ---------- */
#config{position:fixed;inset:0;z-index:150;overflow:auto;background:rgba(3,7,34,.97);font-size:16px}
.cfg{max-width:1280px;margin:0 auto;padding:28px 28px 80px}
.cfg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;position:sticky;top:0;background:rgba(3,7,34,.97);padding:10px 0 14px;z-index:2}
.cfg-head h1{margin:0;font:900 32px/1.1 var(--font-display)}
.cfg-head p{margin:6px 0 0;color:var(--ink-dim)}
.cfg-warnbar{margin-top:10px;padding:10px 14px;border-radius:10px;background:rgba(255,200,61,.12);color:var(--gold);font-weight:700;font-size:14px}
.cfg button.b{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--navy-700);color:#fff}
.cfg button.b:hover{filter:brightness(1.2)}
.cfg button.b.pri{background:var(--grad);font:900 22px/1 var(--font-display);padding:18px 30px;border-radius:999px}
.cfg button.b.danger{background:#5A1420;color:#FFB3B8}
.cfg button.b.ghost{background:transparent;box-shadow:inset 0 0 0 2px rgba(169,183,232,.35)}
.cfg button.b:disabled{opacity:.35;cursor:not-allowed}
.cfg-count{position:sticky;top:96px;z-index:2;margin:6px 0 18px;padding:14px 18px;border-radius:14px;background:var(--navy-800);font:800 20px/1.3 var(--font-body);display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.cfg-count b{color:var(--cyan);font-size:26px}
.cfg-count.warn{background:#3A2A05;box-shadow:inset 0 0 0 2px var(--gold)}
.cfg-count .alert{color:var(--gold)}
.cfg-sec{margin:22px 0;padding:22px;border-radius:18px;background:rgba(11,22,80,.55);box-shadow:inset 0 0 0 1px rgba(169,183,232,.18)}
.cfg-sec h2{margin:0 0 14px;font:900 22px/1 var(--font-display);display:flex;align-items:center;gap:10px}
.pill{font:800 15px/1 var(--font-body);background:var(--cyan);color:var(--navy-900);padding:5px 10px;border-radius:999px}
.cfg textarea{width:100%;min-height:220px;resize:vertical;border-radius:12px;border:0;padding:14px;background:#020517;color:#fff;font:15px/1.5 var(--font-body);box-shadow:inset 0 0 0 1px rgba(169,183,232,.3)}
.cfg input,.cfg select{width:100%;border:0;border-radius:10px;padding:10px 12px;background:#020517;color:#fff;font:15px/1.2 var(--font-body);box-shadow:inset 0 0 0 1px rgba(169,183,232,.3)}
.cfg input:focus,.cfg select:focus,.cfg textarea:focus{outline:2px solid var(--cyan)}
.cfg input:disabled,.cfg textarea:disabled{opacity:.5}
.cfg label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-dim);letter-spacing:.02em}
.cfg .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.cfg .note{color:var(--gold);font-weight:700;margin:0 0 10px}
.cfg .muted{color:var(--ink-dim);font-size:14px}
.filebtn{display:inline-flex;cursor:pointer;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--navy-700);color:#fff;font-size:15px;letter-spacing:0}
.bed{display:grid;grid-template-columns:1fr;gap:14px;padding:16px;border-radius:14px;background:rgba(3,7,34,.6);margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(169,183,232,.15)}
.bed.done{box-shadow:inset 0 0 0 1px rgba(22,208,208,.5)}
.bed-order{display:flex;flex-direction:column;align-items:center;gap:6px}
.bed-order span{font:900 24px/1 var(--font-display)}
.bed-order button{width:40px;height:32px;padding:0!important}
.bed-main{display:grid;gap:12px;min-width:0}
.bed-r1{display:grid;grid-template-columns:28px 1fr 120px auto;gap:12px;align-items:end}
.swatch{width:28px;height:28px;border-radius:50%;margin-bottom:6px;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.step{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--cyan);color:var(--navy-900);font:900 16px/1 var(--font-body)}
.drop{border:2px dashed rgba(169,183,232,.45);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;background:rgba(3,7,34,.45);transition:background .15s,border-color .15s}
.drop.over{border-color:var(--cyan);background:rgba(22,208,208,.12)}
.drop.off{opacity:.45;pointer-events:none}
.drop-t{font:900 20px/1.2 var(--font-body);color:#fff}
.drop-s{color:var(--ink-dim);font-size:14px}
.cfg details{margin-top:14px}
.cfg .names-lbl{margin:16px 0 8px;font-size:15px;color:#fff}
.cfg summary{cursor:pointer;font-weight:700;color:var(--ink-dim);margin-bottom:8px}
.cfg-count .ok{color:var(--cyan)}
.cfg .reh{color:#FF8A8F}
.cfg label[hidden]{display:none!important}
.bed-art{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:end}
.art-prev{width:64px;height:64px;border-radius:12px;background:#E9F0FF;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.art-prev .emoji-art{font-size:46px}
.bed-art .sub{display:flex;gap:8px;margin-top:6px}
.bed-hints{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bed-tag{font-size:12px;font-weight:800;color:var(--cyan);letter-spacing:.06em;text-transform:uppercase}
.cfg-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cfg-help{columns:2;gap:30px;color:var(--ink-dim);font-size:14px;line-height:1.6}
.cfg-help kbd{background:var(--navy-700);color:#fff;border-radius:6px;padding:2px 7px;font:700 13px var(--font-body)}
@media (max-width:900px){.bed-r1{grid-template-columns:1fr 90px}.bed-hints{grid-template-columns:1fr}.cfg-help{columns:1}}
@media (prefers-reduced-motion:reduce){.beam,.spark,.bulbs::before,.bulbs::after{animation:none!important}}

/* confirmação dentro da página (o navegador da versão publicada bloqueia confirm()) */
.cmodal{position:fixed;inset:0;z-index:400;background:rgba(3,7,34,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.cbox{max-width:460px;width:100%;background:var(--navy-800);border-radius:18px;padding:24px;box-shadow:0 0 0 2px var(--gold),0 20px 60px rgba(0,0,0,.6)}
.cbox p{margin:0 0 20px;font:700 18px/1.4 var(--font-body);color:#fff}
.cbtns{display:flex;gap:12px;justify-content:flex-end}
.cbtns button{border:0;border-radius:12px;padding:12px 18px;font:700 15px var(--font-body);background:var(--navy-700);color:#fff}
.cbtns button.danger{background:#B3262C}
.cbtns button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
:root{color-scheme:dark}

.res-grid{gap:14px;padding:12px 0}
.res-foot .btn-mega{font-size:36px;padding:20px 44px}
.rc-head{padding-bottom:8px}
.rcard{padding:14px 18px 16px}

/* cartões do resultado: uma cor por brinde, sem desenho */
.rcard{padding:0 0 16px;gap:10px}
.rc-head{background:var(--c);color:#fff;padding:16px 20px 14px;border-bottom:0;align-items:flex-end}
.rc-head .rc-prize{color:#fff;font-size:38px}
.rc-head .rc-n{color:rgba(255,255,255,.88)}
.rc-names{color:var(--c);padding:0 20px}
.res-grid.c5 .rc-head .rc-prize{font-size:30px}
.res-grid.c5 .rc-names{padding:0 14px}

/* ---------- O grande sorteio: cartões que giram juntos ---------- */
.slot{position:absolute;inset:0;padding:8px 40px 10px;display:flex;flex-direction:column}
.slot-head{text-align:center;padding:0 320px}
.slot-head h1{margin:0;font:400 58px/1 var(--font-display);color:#fff;text-shadow:0 6px 0 var(--navy-700)}
.slot-head p{margin:6px 0 0;font:700 22px/1.3 var(--font-body);color:var(--ink-dim)}
.slot-grid{flex:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;gap:12px;padding:14px 0;min-height:0}
.tile{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding:8px 10px;border-radius:16px;background:#fff;color:var(--navy-900);
  box-shadow:0 8px 20px rgba(0,0,0,.3);transition:background .25s,color .25s}
.t-name{font:400 var(--fs)/1 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.t-reel{display:flex;align-items:center;justify-content:center;min-height:calc(var(--fs) * 1.9);padding:4px 6px;border-radius:10px;background:var(--navy-800);color:var(--ink-dim);
  font:700 calc(var(--fs) * .62)/1.1 var(--font-body);text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2}
.tile.is-spin .t-reel{color:#fff;animation:reelJit .15s linear infinite}
@keyframes reelJit{0%{transform:translateY(-3px)}50%{transform:translateY(3px)}100%{transform:translateY(-3px)}}
.tile.is-stop{background:var(--c,#E3E9FB);color:#fff;animation:pop .45s var(--ease-spring)}
.tile.is-stop .t-reel{background:rgba(255,255,255,.18);color:#fff}
.slot-foot{display:flex;align-items:center;justify-content:center;gap:24px;min-height:120px;position:relative}
.slot-host{position:absolute;left:0;bottom:-6px;display:flex;align-items:flex-end;gap:4px;pointer-events:none}
.slot-host .mascot{height:150px}
.slot-host .bubble{font-size:26px;padding:12px 18px;border-radius:20px;margin-bottom:70px;max-width:520px}
.slot-host .bubble::after{left:-12px;bottom:auto;top:calc(50% - 12px);width:24px;height:24px}

.res-grid.c5 .rcard{padding:0 0 14px}
.res-grid.c5 .rc-head{padding:14px 14px 12px}
.res-foot .btn-ghost{font-size:26px;padding:16px 26px}

/* título dos cartões com altura fixa: a grade começa abaixo da logo */
.slot-head{min-height:100px;display:flex;align-items:center;justify-content:center}

/* ---------- tela de senha ---------- */
#gate{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse 70% 60% at 50% 100%,#1A2FB0,transparent 70%),var(--navy-950)}
.gate-box{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:32px 28px;border-radius:24px;
  background:var(--navy-800);box-shadow:inset 0 0 0 1px rgba(169,183,232,.25),0 24px 60px rgba(0,0,0,.5);text-align:center}
.gate-box .logo-plate{align-self:center;height:84px;padding:12px 22px;margin-bottom:6px}
.gate-box h1{margin:0 0 8px;font:400 34px/1.05 var(--font-display);color:#fff}
.gate-box label{font:700 15px/1 var(--font-body);color:var(--ink-dim);text-align:left}
.gate-box input{border:0;border-radius:12px;padding:14px;font:600 18px/1 var(--font-body);background:#020517;color:#fff;box-shadow:inset 0 0 0 1px rgba(169,183,232,.35)}
.gate-box input:focus{outline:2px solid var(--cyan)}
.gate-err{margin:0;color:#FF8A8F;font:700 15px/1.3 var(--font-body);text-align:left}
.gate-box .b{border:0;border-radius:999px;padding:16px;font:400 22px/1 var(--font-display);color:#fff;background:linear-gradient(100deg,#1235E0,#153EFD 60%,#1F4BFF);cursor:pointer}
.gate-box .b:disabled{opacity:.6}

.res-grid.c5 .rc-names{font-size:27px}
.res-grid.c5 .rc-head .rc-prize{font-size:26px;line-height:1.05}

/* resultado: título abaixo da logo e cabeçalho do cartão só com o nome do brinde */
.res-head{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rc-head{padding:14px 18px;min-height:0;align-items:center}
.rc-head .rc-prize{line-height:1.05}

.res-grid.c5 .rc-head .rc-prize{font-size:32px}
.rc-head .rc-prize{font-size:40px}

</style>
</head>
<body>
<div id="stage">
  <div id="shaker">
    <div class="bg"><div class="floor"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div id="sparkles"></div></div>
    <div class="bulbs top"></div><div class="bulbs bottom"></div>
    <div id="screen"></div>
    <div id="overlay"></div>
    <div id="rehearsalTag" hidden>TESTE · nada é salvo</div>
  </div>
</div>
<canvas id="confetti"></canvas>
<nav id="modeTabs" aria-label="Escolha o modo">
  <button type="button" data-mode="teste">Teste</button>
  <button type="button" data-mode="meu">Meu sorteio</button>
</nav>
<div id="hud">
  <button id="bGear" class="gear" title="Configuração (operador)" aria-label="Configuração"></button>
  <button id="bFull" title="Tela cheia (F)" aria-label="Tela cheia"></button>
  <button id="bMute" aria-label="Som"></button>
  <input id="vol" type="range" min="0" max="100" title="Volume" aria-label="Volume">
</div>
<div id="config" hidden></div>
<div id="toast" role="status"></div>

function randInt(n) { const max = Math.floor(0x100000000 / n) * n; const a = new Uint32Array(1); do { crypto.getRandomValues(a); } while (a[0] >= max); return a[0] % n; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function cap(s) { return s ? s.charAt(0).toLocaleUpperCase('pt-BR') + s.slice(1) : s; }
function assignDisplay(list) {
  const info = list.map(p => {
    const w = p.full.split(' ').filter(Boolean);
    const sur = w.slice(1).filter(x => !PARTICLES.has(x.toLowerCase()));
    return { p, first: cap(w[0] || '?'), last: sur.length ? sur[sur.length - 1] : '', k: 1 };
  });
  const label = i => !i.last ? i.first : i.k >= i.last.length ? `${i.first} ${cap(i.last)}` : `${i.first} ${cap(i.last.slice(0, i.k))}.`;
  for (let iter = 0; iter < 30; iter++) {
    const g = {}; info.forEach(i => (g[label(i).toLowerCase()] ||= []).push(i));
    let changed = false;
    Object.values(g).forEach(arr => { if (arr.length > 1) arr.forEach(i => { if (i.last && i.k < i.last.length) { i.k++; changed = true; } }); });
    if (!changed) break;
  }
  const seen = {};
  info.forEach(i => { let l = label(i); const key = l.toLowerCase(); seen[key] = (seen[key] || 0) + 1; if (seen[key] > 1) l += ` (${seen[key]})`; i.p.display = l; });
  return list;
}

  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast(' Não consegui salvar no navegador (armazenamento cheio? use imagens menores).'); }
}
function reindex() { PMAP = new Map(S.participants.map(p => [p.id, p])); }
const P = id => PMAP.get(id) || { id, full: '(removido)', display: '?' };
const cur = () => S.blocks.find(b => b.id === S.currentId);
const blockNo = b => S.blocks.indexOf(b) + 1;
const totalQty = () => S.blocks.reduce((s, b) => s + (+b.qty || 0), 0);
const hasProgress = () => Object.keys(S.results).length > 0;
const isDone = b => S.results[b.id]?.stage === 'revealed';
const nextBlock = () => S.blocks.find(b => !isDone(b));
function poolFor(bid) {
  const won = new Set(); for (const [k, r] of Object.entries(S.results)) if (k !== bid) r.winners.forEach(id => won.add(id));
  return S.participants.filter(p => !won.has(p.id));
}

/* ---------- utilidades de tela ---------- */
let GEN = 0, TIMERS = [], PRIMARY = null, BUSY = false, CONFIG_OPEN = false, ANIM_REVEAL = false, ANIM_RESULTS = false;
function later(fn, ms) { const g = GEN; const t = setTimeout(() => { if (g === GEN) fn(); }, ms); TIMERS.push(t); return t; }
const wait = ms => new Promise(r => later(r, ms));
function toast(msg, ms = 3200) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function shakeStage(px = 14, dur = 400) {
  const el = $('#shaker'); const k = [];
  for (let i = 0; i <= 8; i++) { const f = 1 - i / 8; k.push({ transform: i === 8 ? 'none' : `translate(${(Math.random() * 2 - 1) * px * f}px,${(Math.random() * 2 - 1) * px * f}px) rotate(${(Math.random() * 2 - 1) * px * .04 * f}deg)` }); }
  el.animate(k, { duration: dur, easing: 'linear' });
}
function stageCenter(xr = .5, yr = .5) { const r = $('#stage').getBoundingClientRect(); return { x: r.left + r.width * xr, y: r.top + r.height * yr }; }

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('#stage').style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
  CF.resize();
}

/* ---------- confete (canvas) ---------- */
const CF = {
  c: null, x: null, parts: [], raf: 0, rain: false, dpr: 1,
  colors: ['#153EFD', '#16D0D0', '#FFFFFF', '#1569F0', '#7FE7FF', '#FFC83D'],
  init() { this.c = $('#confetti'); this.x = this.c.getContext('2d'); this.resize(); },
  resize() { if (!this.c) return; this.dpr = Math.min(2, devicePixelRatio || 1); this.c.width = innerWidth * this.dpr; this.c.height = innerHeight * this.dpr; },
  add(x, y, vx, vy, gold) {
    this.parts.push({ x, y, vx, vy, r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, w: 8 + Math.random() * 8, h: 12 + Math.random() * 10,
      c: gold && Math.random() < .3 ? '#FFC83D' : this.colors[Math.floor(Math.random() * 5)], t: 0, wob: Math.random() * 6.28 });
  },
  burst(x, y, n = 160, power = 16, gold = true) {
    for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = power * (.45 + Math.random() * .75); this.add(x, y, Math.cos(a) * v, Math.sin(a) * v, gold); }
    this.go();
  },
  cannons() { const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    this.burst(innerWidth * .5, innerHeight * .45, 220, 20 * s + 6);
    later(() => { this.burst(innerWidth * .08, innerHeight * .95, 120, 24 * s + 6); this.burst(innerWidth * .92, innerHeight * .95, 120, 24 * s + 6); }, 250);
  },
  setRain(on) { this.rain = on; if (on) this.go(); },
  go() { if (!this.raf) this.raf = requestAnimationFrame(() => this.tick()); },
  tick() {
    const { x, c } = this; const d = this.dpr;
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(d, 0, 0, d, 0, 0);
    if (this.rain && this.parts.length < 110 && Math.random() < .55) for (let i = 0; i < 1; i++) this.add(Math.random() * innerWidth, -20, (Math.random() - .5) * 2, 2 + Math.random() * 2, true);
    const H = innerHeight + 40;
    this.parts = this.parts.filter(p => p.y < H && p.t < 900);
    for (const p of this.parts) {
      p.t++; p.vy += .32; p.vx *= .985; p.vy *= .985; if (p.vy > 6) p.vy = 6;
      p.wob += .12; p.x += p.vx + Math.sin(p.wob) * .8; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.scale(1, Math.cos(p.wob)); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    }
    this.raf = (this.parts.length || this.rain) ? requestAnimationFrame(() => this.tick()) : 0;
    if (!this.raf) { x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); }
  },
};

/* ================= TELAS ================= */
function go(phase) { S.phase = phase; save(); render(); }
function render() {
  GEN++; TIMERS.forEach(clearTimeout); TIMERS = []; BUSY = false; PRIMARY = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  closeOverlay();
  document.querySelectorAll('.as-black').forEach(e => e.remove());
  const host = $('#screen'); host.innerHTML = '';
  const el = document.createElement('div'); el.className = 'scr'; host.appendChild(el);
  (SCREENS[S.phase] || SCREENS.opening)(el);
  $('#rehearsalTag').hidden = !S.rehearsal;
  paintTabs();
  CF.setRain(S.phase === 'end');
  document.title = 'Sorteio de Fim de Ano · Trilha';
}
const logoMini = () => `<div class="logo-plate logo-mini"><img src="${LOGO}" alt="Trilha"></div>`;

const SCREENS = {
  /* ---- 4.2 Abertura ---- */
  opening(el) {
    const n = S.participants.length, t = totalQty();
    el.innerHTML = `<div class="opening"><div class="op-main">
        <div class="logo-plate"><img src="${LOGO}" alt="Trilha Gestão"></div>
        <h1 class="op-title"><span class="l1">Grande Sorteio</span><span class="l2 grad-text">de Fim de Ano</span></h1>
        <p class="op-sub">${t} brindes · ${S.participants.length} pessoas · um giro só</p>
        ${n ? '' : `<div class="op-warn"> Antes de começar, cadastre os participantes na engrenagem (canto superior direito).</div>`}

  board(el) {
    const nb = nextBlock(), done = S.blocks.filter(isDone).length;

  /* ---- O grande sorteio: todo mundo gira junto ---- */
  bigspin(el) {
    const people = [...S.participants].sort((a, b) => a.display.localeCompare(b.display, 'pt-BR'));
    const N = people.length, total = Math.min(totalQty(), N);
    const cols = Math.max(4, Math.min(12, Math.round(Math.sqrt(N * 1.55))));
    const rows = Math.max(1, Math.ceil(N / cols));
    const tileW = (1840 - (cols - 1) * 12) / cols, tileH = (770 - (rows - 1) * 12) / rows;

      <footer class="slot-foot"><div id="slotCta">${done ? '<button class="btn btn-primary btn-mega" data-act="toResults">Ver por brinde <span class="key">ESPAÇO</span></button>'
          : '<button class="btn btn-primary btn-mega pulse" data-act="bigSpin">SORTEAR! <span class="key">ESPAÇO</span></button>'}</div></footer></div>`;
    if (!N) { $('#slotCta').innerHTML = '<p class="empty-msg">Sem participantes. Cadastre os nomes em Meu sorteio.</p>'; return; }
    PRIMARY = done ? () => go('results') : doBigSpin;
  },

  /* ---- Resultado: todos os brindes de uma vez ---- */
  results(el) {
    const blocks = S.blocks.filter(b => S.results[b.id] && S.results[b.id].winners.length);
    const cols = blocks.length <= 4 ? Math.max(1, blocks.length) : blocks.length <= 8 ? 4 : 5;

      <div class="res-grid ${cols >= 5 ? 'c5' : ''}" style="--cols:${cols}">${blocks.map((b, i) => { const r = S.results[b.id]; return `<div class="rcard" style="--i:${i};--c:${prizeColor(b)}">

  /* ---- 4.4 Roleta ---- */
  spin(el) {
    const b = cur(); if (!b) return go('board');

  summary(el) {
    const rows = summaryRows();
    const abs = rows.filter(r => r.absent);
    el.innerHTML = `${logoMini()}<div class="sum"><div class="sum-head"><div><h2>Quem ganhou o quê</h2></div>

      </tbody></table></div>

};

function chipsHTML(r, cls) {
  const dense = r.winners.length > 8 ? 'dense' : '';
  return `<div class="${cls} ${dense}">${r.winners.map((id, i) => `<span class="chip ${r.absent[id] ? 'abs' : ''}" style="--i:${i}">${esc(P(id).display)}</span>`).join('')}</div>`;
}

/* ---------- roleta ---------- */
let WHEEL = null;
const SLICE = [['#153EFD', '#fff'], ['#16D0D0', '#060D35'], ['#1B2F9A', '#fff'], ['#E9F0FF', '#0B1650']]; // contraste ≥ 6,7:1 para projetor
function makeWheel(cv, pool) {
  const N = pool.length, x = cv.getContext('2d'), W = cv.width, R = W / 2, s = Math.PI * 2 / N;
  const fs = Math.max(30, Math.min(76, Math.floor(0.7 * 2 * Math.PI * 0.72 * R / N))); // cabe na altura da fatia
  x.translate(R, R);
  for (let i = 0; i < N; i++) {
    let ci = i % 4; if (i === N - 1 && ci === 0 && N > 1) ci = 2;
    const a0 = -Math.PI / 2 + i * s;
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R - 4, a0, a0 + s); x.closePath(); x.fillStyle = SLICE[ci][0]; x.fill();
    x.strokeStyle = 'rgba(6,13,53,.35)'; x.lineWidth = 3; x.stroke();
    x.save(); x.rotate(a0 + s / 2); x.fillStyle = SLICE[ci][1]; x.font = `900 ${fs}px "Lilita One","Segoe UI Black","Arial Black",sans-serif`;
    x.textAlign = 'right'; x.textBaseline = 'middle';
    let t = pool[i].display; const maxW = R * .66; while (x.measureText(t).width > maxW && t.length > 3) t = t.slice(0, -2) + '…';

  apply();

    setTo(idx) { rot = -(idx + .5) * s; apply(); $('#visor').textContent = pool[idx].display; },
    markWon(idx) {

          if (g !== GEN) return res(false);

          if (u !== last) { last = u; visor.textContent = pool[u].display; if (now - lastTick > 45) { lastTick = now; AU.play('ratchet'); ptr.classList.remove('tick'); void ptr.offsetWidth; ptr.classList.add('tick'); } }
          if (t < 1) requestAnimationFrame(frame); else { wrap.classList.remove('spinning'); res(true); }
        };

      });
    },
  };
}

    S.results = {};

    S.bigDrawn = true;

  const prizeOf = {}; S.blocks.forEach(b => S.results[b.id] && S.results[b.id].winners.forEach(id => { prizeOf[id] = b; }));

/* ================= SENHA DE ACESSO + LISTA SALVA NO LINK =================
   A lista de nomes vai dentro do site, criptografada (AES-GCM) com a senha.
   Sem a senha, o arquivo publicado só tem um texto embaralhado.            */
let VAULT_DATA = null;
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64u8(VAULT.s), iterations: VAULT.n, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64u8(VAULT.i) }, key, b64u8(VAULT.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
/* a lista do link entra no "Meu sorteio" quando este navegador ainda não tem lista própria,
   ou quando a versão do link mudou desde a última vez */
function applyVault() {
  if (!VAULT_DATA || !Array.isArray(VAULT_DATA.names) || !VAULT_DATA.names.length || S.rehearsal) return;
  const ver = VAULT_DATA.v || '';
  if (S.bigDrawn) {
    // sorteio já feito: só atualiza o nome dos brindes (mesma ordem e quantidade), sem mexer no resultado
    const vb = VAULT_DATA.blocks || [];
    if (S.vaultVer !== ver && vb.length === S.blocks.length && vb.every((b, i) => +b.qty === +S.blocks[i].qty)) {
      vb.forEach((b, i) => { S.blocks[i].prize = b.prize; });
      S.vaultVer = ver; save();
    }
    return;
  }
  if (!S.participantsText || (S.vaultVer && S.vaultVer !== ver)) {
    S.participantsText = VAULT_DATA.names.join('\n');
    S.participants = buildParticipants(VAULT_DATA.names);
    if (Array.isArray(VAULT_DATA.blocks) && VAULT_DATA.blocks.length) S.blocks = VAULT_DATA.blocks.map((b, i) => ({ id: 'b' + (i + 1), prize: b.prize, qty: b.qty, game: 'emoji', art: { type: 'svg', value: 'copo' }, extra: '', question: '', talk: [] }));
    S.vaultVer = ver; S.phase = 'opening';
    save();
  }
}

function prizeSVG(key) {
  const p = PRIZE_SVGS[key] || PRIZE_SVGS.copo;
  return `<svg class="prize-svg" viewBox="0 0 200 200" aria-hidden="true">${p.svg()}</svg>`;
}

/* desenha a arte do bloco: SVG pronto, emoji ou imagem enviada */
function artHTML(b) {
  const a = b.art || { type: 'svg', value: 'copo' };
  if (a.type === 'emoji') return `<span class="emoji-art">${esc(a.value || '🎁')}</span>`;
  if (a.type === 'img' && a.value) return `<img class="img-art" src="${a.value}" alt="">`;
  return prizeSVG(a.value);
}

/* ================= SONS (100% Web Audio, nada externo) ================= */
const AU = {
  ctx: null, master: null, noiseBuf: null, muted: false, vol: 0.8,
  loadPrefs() {
    try { const p = JSON.parse(localStorage.getItem('sorteioTrilha.audio') || '{}'); if (typeof p.vol === 'number') this.vol = p.vol; this.muted = !!p.muted; } catch (e) {}
  },

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

/* zip "store" (sem compressão) — o Excel abre normalmente */
function zipStore(files) {
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const d = new Date(); const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name); const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data; const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

/* ---- leitura de .xlsx (zip + deflate nativo do navegador) ---- */
async function unzipEntries(buf, want) {
  const dv = new DataView(buf); let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 70000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('Arquivo .xlsx inválido');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder(); const out = {};
  for (let k = 0; k < count; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nlen));
    p += 46 + nlen + elen + clen;
    if (!want(name)) continue;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const raw = new Uint8Array(buf, start, csize);
    let data;
    if (method === 0) data = raw;
    else if (method === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Navegador sem suporte a .xlsx — use CSV');
      const ds = new DecompressionStream('deflate-raw');
      data = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
    } else continue;
    out[name] = dec.decode(data);
  }
  return out;
}

async function readXlsxSheets(buf) {
  const files = await unzipEntries(buf, n => n === 'xl/sharedStrings.xml' || /^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  const sheetNames = Object.keys(files).filter(n => n.startsWith('xl/worksheets/')).sort((a, b) => parseInt(a.match(/\d+/)) - parseInt(b.match(/\d+/)));
  if (!sheetNames.length) throw new Error('A planilha está vazia.');
  const P = new DOMParser();
  let shared = [];
  if (files['xl/sharedStrings.xml']) {
    const sd = P.parseFromString(files['xl/sharedStrings.xml'], 'application/xml');
    shared = [...sd.getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  }
  return sheetNames.map(name => {
    const doc = P.parseFromString(files[name], 'application/xml');
    return [...doc.getElementsByTagName('row')].map(row => {
      const r = [];
      for (const c of row.getElementsByTagName('c')) {
        const ref = c.getAttribute('r') || ''; const letters = (ref.match(/^[A-Z]+/) || ['A'])[0];
        const ci = [...letters].reduce((s, ch) => s * 26 + ch.charCodeAt(0) - 64, 0) - 1;
        const t = c.getAttribute('t'); let v = '';
        if (t === 's') v = shared[+((c.getElementsByTagName('v')[0] || {}).textContent)] || '';
        else if (t === 'inlineStr') v = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else v = (c.getElementsByTagName('v')[0] || {}).textContent || '';
        r[ci] = v;
      }
      return r;
    });
  });
}
/* aba de brindes: cabeçalho com "Brinde" e "Quantidade" */
function pickPrizes(rows) {
  const h = (rows[0] || []).map(v => String(v || ''));
  const pi = h.findIndex(v => /brinde|pr[eê]mio/i.test(v)), qi = h.findIndex(v => /quant|qtd/i.test(v));
  if (pi < 0 || qi < 0) return null;
  return rows.slice(1).map(r => ({ prize: String(r[pi] ?? '').trim(), qty: parseInt(r[qi]) || 0 })).filter(x => x.prize && x.qty > 0);
}
async function readXlsxNames(buf) {
  const sheets = await readXlsxSheets(buf);
  let prizes = null, prizeIdx = -1;
  sheets.forEach((rows, i) => { if (!prizes) { const p = pickPrizes(rows); if (p) { prizes = p; prizeIdx = i; } } });
  const isNames = rows => (rows[0] || []).some(v => /nome|name|colaborador|participante/i.test(String(v || '')));
  let ni = sheets.findIndex((rows, i) => i !== prizeIdx && isNames(rows));
  if (ni < 0) ni = sheets.findIndex((_, i) => i !== prizeIdx);
  return { names: ni >= 0 ? pickNameColumn(sheets[ni]) : [], prizes };
}
function readCsvNames(buf) {
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes(String.fromCharCode(0xFFFD))) txt = new TextDecoder('windows-1252').decode(buf);
  txt = txt.replace(/^﻿/, '');
  const lines = txt.split(/\r?\n/).filter(l => l.trim());
  const sep = [';', '\t', ','].find(s => lines[0] && lines[0].includes(s));
  const rows = lines.map(l => sep ? l.split(sep).map(v => v.replace(/^"|"$/g, '').trim()) : [l.trim()]);
  return pickNameColumn(rows);
}
async function importNamesFile(file) {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf, 0, 2);
  if (/\.xlsx$/i.test(file.name) || (u8[0] === 0x50 && u8[1] === 0x4B)) return readXlsxNames(buf);
  if (/\.xls$/i.test(file.name)) throw new Error('Formato .xls antigo: salve como .xlsx ou CSV');
  return { names: readCsvNames(buf), prizes: null };
}

/* imagem enviada → base64 reduzida */
function imageFileToDataURL(file, max = 520) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não consegui ler a imagem'));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let url = cv.toDataURL('image/webp', .86);
        if (!url.startsWith('data:image/webp')) url = cv.toDataURL('image/png');
        resolve(url);
      };
      img.onerror = () => reject(new Error('Imagem inválida'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ================= 8 MODELOS DE BRINCADEIRA (componentes reutilizáveis) =================
   Cada bloco tem UMA grande pergunta. O modelo cria o clima visual em volta dela.
   mount(el, bloco, mostrada)  → desenha o estado atual (mostrada = a pergunta já apareceu?), sem som
   show(el, bloco)             → anima o momento em que a pergunta aparece (com som)              */

function seeded(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
function graphemes(s) { try { return [...new Intl.Segmenter('pt', { granularity: 'grapheme' }).segment(s)].map(x => x.segment).filter(g => g.trim()); } catch (e) { return [...s].filter(g => g.trim()); } }
